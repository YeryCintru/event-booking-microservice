spring.application.name=auth-service
server.port=8081

# Conexión a la base de datos de Auth Service en Docker
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db
spring.datasource.username=postgres
spring.datasource.password=postgrespassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# Actuator: Exponer endpoints de diagnóstico
# ==========================================
management.endpoints.web.exposure.include=health,info,gateway,prometheus
management.endpoint.prometheus.enabled=true

# ==========================================
# Métricas: Etiquetar con el nombre del servicio
# ==========================================
management.metrics.tags.application=${spring.application.name}

# ==========================================
# Tracing: Conexión con Zipkin
# ==========================================
management.zipkin.tracing.endpoint=${MANAGEMENT_ZIPKIN_URL:http://zipkin:9411/api/v2/spans}
management.tracing.sampling.probability=1.0