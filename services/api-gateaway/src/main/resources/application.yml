server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Configuracion de los CORS global
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173,http://localhost"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      
      # Reglas de enrutamiento
      routes:
        # Ruta hacia Auth Service
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
            
        # Ruta hacia Event Service
        - id: event-service
          uri: ${EVENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/events/**
        # Ruta hacia Booking Service
        - id: booking-service
          uri: ${BOOKING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/bookings/**

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_URL:http://zipkin:9411/api/v2/spans}
  tracing:
    sampling:
      probability: 1.0 # 100% de las peticiones rastreadas (en producción se reduce, ej: 0.1)
