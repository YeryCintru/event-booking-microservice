spring.application.name=event-service
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5433/event_db
spring.datasource.username=postgres
spring.datasource.password=postgrespassword
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# Actuator: Exponer endpoints de diagnóstico
# ==========================================
management.endpoints.web.exposure.include=health,info,gateway,prometheus
management.endpoint.prometheus.enabled=true

# ==========================================
# Métricas: Etiquetar con el nombre del servicio
# ==========================================
management.metrics.tags.application=${spring.application.name}

# ==========================================
# Tracing: Conexión con Zipkin
# ==========================================
management.zipkin.tracing.endpoint=${MANAGEMENT_ZIPKIN_URL:http://zipkin:9411/api/v2/spans}
management.tracing.sampling.probability=1.0

# ==========================================
# RabbitMQ: Configuración de conexión
# ==========================================

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest