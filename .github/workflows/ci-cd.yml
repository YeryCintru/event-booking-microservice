name: EventBooking CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master"]

jobs:
  # JOB 1: Compilar y testear Microservicios de Java
  build-backend:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service: [auth-service, event-service, booking-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
        
      - name: Compilar y testear ${{matrix.service}}
        run: |
          cd services/${{matrix.service}}
          mvn clean package -DskipTests

  # JOB 2: Validar Build de Frontend
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias y compilar frontend
        run: |
          cd frontend
          npm ci
          npm run build

  # JOB 3: Validar construccion de imágenes en Docker
  docker-build:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagen Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/auth-service
          push: false
          tags: eventbooking/auth-service:test

      - name: Build imagen Event Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/event-service
          push: false
          tags: eventbooking/event-service:test

      - name: Build imagen Booking Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/booking-service
          push: false
          tags: eventbooking/booking-service:test

      - name: Build imagen Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: eventbooking/frontend:test