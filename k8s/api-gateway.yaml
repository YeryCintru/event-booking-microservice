apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    apps: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: eventbooking/api-gateway:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: AUTH_SERVICE_URL
          value: "http://auth-service:8081"
        - name: EVENT_SERVICE_URL
          value: "http://event-service:8082"
        - name: BOOKING_SERVICE_URL
          value: "http://booking-service:8083"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: api-gateway